# Static site, no build step (docs/PLAN.md D-27).
[build]
  publish = "."
  command = ""

# Implementation A is the canonical site (D-50). The root redirects to it;
# impl-b/ and compare.html remain reachable as the model-comparison evidence.
[[redirects]]
  from = "/"
  to = "/impl-a/index.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
